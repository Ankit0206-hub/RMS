server {
    listen       80;
    server_name  localhost;

    # Serve static files and fallback to index.html for SPA routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API
    # This assumes the backend service is named 'backend' in docker-compose
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "http://backend:8000";
        # We append the matched URI because when proxy_pass uses variables, it doesn't automatically rewrite the path in the same way.
        # Actually, if we use proxy_pass $backend; with NO URI, the original request URI is passed verbatim.
        # This matches the previous behavior where `proxy_pass http://backend:8000/api/;` mapped `/api/foo` to `/api/foo`.
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
